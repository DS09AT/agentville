name: Release Please

on:
  push:
    branches:
      - main

# The job states the scopes it needs; nothing is granted workflow-wide.
permissions: {}

# Runs are serialised rather than cancelled: an interrupted release would leave a tag
# or the release branch half written.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      contents: write       # Create the release tag, GitHub Release, and update the release branch
      pull-requests: write  # Open and groom the release pull request
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
